<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Thanksgiving!</title>
  <meta name="description" content="A Thanksgiving greeting from a very happy turkey.">
  <meta name="theme-color" content="#123a2f">
  <meta property="og:title" content="Happy Thanksgiving!">
  <meta property="og:description" content="A Thanksgiving greeting from a very happy turkey.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦃%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="thanksgiving.css">
</head>
<body>
  <main>
    <div class="stage">
      <button class="turkey" type="button" aria-label="Make the turkey gobble">
        <svg viewBox="0 0 400 370" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <g id="feather">
              <ellipse cx="200" cy="120" rx="27" ry="88"/>
              <path d="M200 200V76" stroke="#fff" stroke-opacity=".28" stroke-width="3" stroke-linecap="round" fill="none"/>
              <ellipse cx="200" cy="58" rx="14" ry="13" fill="#fff4d6" opacity=".6"/>
            </g>
          </defs>

          <ellipse cx="200" cy="357" rx="96" ry="9" fill="#000" opacity=".25"/>

          <!-- tail fan: change --c to recolor a feather -->
          <use href="#feather" class="f" style="--a:-80deg;--c:#6e3a14;--i:4"/>
          <use href="#feather" class="f" style="--a:80deg;--c:#6e3a14;--i:4"/>
          <use href="#feather" class="f" style="--a:-60deg;--c:#c8321f;--i:3"/>
          <use href="#feather" class="f" style="--a:60deg;--c:#c8321f;--i:3"/>
          <use href="#feather" class="f" style="--a:-40deg;--c:#e8651a;--i:2"/>
          <use href="#feather" class="f" style="--a:40deg;--c:#e8651a;--i:2"/>
          <use href="#feather" class="f" style="--a:-20deg;--c:#f08a1c;--i:1"/>
          <use href="#feather" class="f" style="--a:20deg;--c:#f08a1c;--i:1"/>
          <use href="#feather" class="f" style="--a:0deg;--c:#f6c133;--i:0"/>

          <!-- feet -->
          <g fill="none" stroke="#f5a623" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M178 320v24m-14 8 14-8 14 8"/>
            <path d="M222 320v24m-14 8 14-8 14 8"/>
          </g>

          <!-- body, belly and wings -->
          <ellipse cx="200" cy="255" rx="78" ry="72" fill="#8b5a2b"/>
          <ellipse cx="200" cy="272" rx="50" ry="44" fill="#b07a40"/>
          <path d="M164 262q8 10 16 0m12 0q8 10 16 0m12 0q8 10 16 0M178 284q8 10 16 0m12 0q8 10 16 0" fill="none" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
          <g transform="rotate(18 146 262)">
            <ellipse cx="146" cy="262" rx="20" ry="34" fill="#6b4220"/>
            <path d="M140 244v36M152 242v40" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
          </g>
          <g transform="rotate(-18 254 262)">
            <ellipse cx="254" cy="262" rx="20" ry="34" fill="#6b4220"/>
            <path d="M248 242v40M260 244v36" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>
          </g>

          <!-- head -->
          <circle cx="200" cy="180" r="34" fill="#8b5a2b"/>
          <ellipse cx="174" cy="188" rx="8" ry="5" fill="#e9734f" opacity=".55"/>
          <ellipse cx="226" cy="188" rx="8" ry="5" fill="#e9734f" opacity=".55"/>
          <path d="M193 196q7 36 14 0z" fill="#d6382a"/>
          <path d="M190 184h20l-10 16z" fill="#f5a623"/>
          <circle cx="187" cy="171" r="8" fill="#fff"/>
          <circle cx="213" cy="171" r="8" fill="#fff"/>
          <circle cx="189" cy="172" r="4" fill="#222"/>
          <circle cx="211" cy="172" r="4" fill="#222"/>
          <circle cx="190.5" cy="170.5" r="1.5" fill="#fff"/>
          <circle cx="212.5" cy="170.5" r="1.5" fill="#fff"/>

          <!-- pilgrim hat -->
          <path d="M172 146l6-42h44l6 42z" fill="#2b1d2a"/>
          <rect x="175" y="126" width="50" height="11" fill="#5b4636"/>
          <rect x="191" y="124" width="18" height="15" rx="2" fill="none" stroke="#f6c133" stroke-width="3"/>
          <ellipse cx="200" cy="146" rx="46" ry="9" fill="#2b1d2a"/>
        </svg>
      </button>
      <span class="bubble" role="status"></span>
    </div>

    <h1>Happy Thanksgiving!</h1>
    <p>gobble gobble.</p>
    <p class="countdown" id="countdown"></p>
  </main>
  <script src="thanksgiving.js" defer></script>
</body>
</html>
